<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Automação WhatsApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            light: '#3fbaeb',
                            DEFAULT: '#0ea5e9',
                            dark: '#0284c7',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex">

    <!-- Sidebar lateral -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col">
        <div class="h-16 flex items-center px-6 border-b border-slate-700 font-bold text-xl tracking-wider">
            WA <span class="text-brand ml-1">Painel</span>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <button onclick="switchTab('disparos')" id="btn-disparos" class="w-full text-left px-4 py-2 bg-brand rounded-lg font-medium transition-colors">Disparos</button>
            <button onclick="switchTab('instancias')" id="btn-instancias" class="w-full text-left px-4 py-2 hover:bg-slate-800 rounded-lg font-medium transition-colors">Instâncias</button>
        </nav>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto">
        
        <!-- Header Superior -->
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 shadow-sm shrink-0">
            <h1 class="text-2xl font-semibold text-slate-800" id="page-title">Painel de Disparos</h1>
            <div class="flex items-center space-x-3">
                <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
                <span class="text-sm font-medium text-slate-600">Servidor Online</span>
            </div>
        </header>

        <div class="p-8">
            <!-- ================= ABA: DISPAROS ================= -->
            <div id="tab-disparos" class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                
                <!-- Card: Disparo de Teste -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <h2 class="text-lg font-bold mb-4 flex items-center">
                        Teste Rápido
                    </h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">Instância</label>
                            <input type="text" id="testInstanceName" value="minha_instancia" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand outline-none transition-all">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">Número Destino (com DDD)</label>
                            <input type="text" id="testNumber" placeholder="Ex: 5511999999999" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand outline-none transition-all">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">Mensagem</label>
                            <textarea id="testMessage" rows="3" placeholder="Digite sua mensagem de teste..." class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand outline-none transition-all"></textarea>
                        </div>
                        <button onclick="sendTestMessage()" id="btnSendTest" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-2 px-4 rounded-lg transition-colors">
                            Enviar Teste
                        </button>
                    </div>
                </div>

                <!-- Card: Disparo em Massa (Layout Placeholder) -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <h2 class="text-lg font-bold mb-4 flex items-center">
                        Disparo em Massa (TXT)
                    </h2>
                    <div class="space-y-4">
                        <div class="border-2 border-dashed border-slate-300 rounded-xl p-8 flex flex-col items-center justify-center hover:bg-slate-50 transition-colors cursor-pointer">
                            <p class="text-sm font-medium text-slate-600 text-center">Clique para carregar sua lista .txt</p>
                            <p class="text-xs text-slate-400 mt-1">Em breve...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ================= ABA: INSTÂNCIAS ================= -->
            <div id="tab-instancias" class="hidden space-y-8">
                
                <!-- Card: Criar Instância -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <h2 class="text-lg font-bold mb-4">Nova Instância</h2>
                    <div class="flex items-end space-x-4">
                        <div class="flex-1">
                            <label class="block text-sm font-medium text-slate-600 mb-1">Nome da Instância</label>
                            <input type="text" id="newInstanceName" placeholder="Ex: chip_01" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand outline-none transition-all">
                        </div>
                        <button onclick="createNewInstance()" id="btnCreateInstance" class="bg-brand hover:bg-brand-dark text-white font-semibold py-2 px-6 rounded-lg transition-colors">
                            Criar e Gerar QR Code
                        </button>
                    </div>
                    
                    <!-- Área do QR Code (Escondida por padrão) -->
                    <div id="qrCodeArea" class="hidden mt-6 flex flex-col items-center justify-center p-6 border border-slate-200 rounded-lg bg-slate-50">
                        <h3 class="font-bold text-slate-700 mb-2">Escaneie o QR Code no WhatsApp</h3>
                        <div id="qrCodeContainer" class="bg-white p-4 rounded-lg shadow-sm">
                            <img id="qrCodeImg" src="" alt="QR Code" class="w-64 h-64 object-contain">
                        </div>
                        <p class="text-sm text-slate-500 mt-4">O QR Code expira em alguns segundos.</p>
                    </div>
                </div>

                <!-- Card: Lista de Instâncias -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold">Instâncias Conectadas</h2>
                        <button onclick="loadInstances()" class="text-sm text-brand hover:underline">Atualizar Lista</button>
                    </div>
                    
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 text-sm text-slate-600">
                                    <th class="p-3">Nome</th>
                                    <th class="p-3">Status</th>
                                    <th class="p-3">Número</th>
                                </tr>
                            </thead>
                            <tbody id="instancesTableBody" class="text-sm">
                                <!-- Preenchido via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        // Função para alternar as abas
        function switchTab(tabName) {
            // Esconde todas
            document.getElementById('tab-disparos').classList.add('hidden');
            document.getElementById('tab-instancias').classList.add('hidden');
            
            // Reseta cores dos botões do menu
            document.getElementById('btn-disparos').classList.remove('bg-brand');
            document.getElementById('btn-instancias').classList.remove('bg-brand');
            document.getElementById('btn-disparos').classList.add('hover:bg-slate-800');
            document.getElementById('btn-instancias').classList.add('hover:bg-slate-800');

            // Mostra a selecionada
            document.getElementById('tab-' + tabName).classList.remove('hidden');
            document.getElementById('btn-' + tabName).classList.remove('hover:bg-slate-800');
            document.getElementById('btn-' + tabName).classList.add('bg-brand');

            // Atualiza Título
            if(tabName === 'disparos') document.getElementById('page-title').innerText = 'Painel de Disparos';
            if(tabName === 'instancias') {
                document.getElementById('page-title').innerText = 'Gerenciador de Instâncias';
                loadInstances(); // Carrega a lista ao abrir a aba
            }
        }

        // Função para Enviar Mensagem de Teste
        async function sendTestMessage() {
            const btn = document.getElementById('btnSendTest');
            const instanceName = document.getElementById('testInstanceName').value;
            const number = document.getElementById('testNumber').value;
            const message = document.getElementById('testMessage').value;

            if (!number || !message) {
                alert("Preencha o número e a mensagem!");
                return;
            }

            btn.innerText = "Enviando...";
            btn.disabled = true;

            try {
                const response = await fetch('/send_message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ instanceName, number, message })
                });
                
                const data = await response.json();
                if (data.success) {
                    alert("Mensagem enviada com sucesso!");
                    document.getElementById('testMessage').value = '';
                } else {
                    alert("Erro ao enviar: " + JSON.stringify(data.error));
                }
            } catch (error) {
                alert("Erro no servidor: " + error);
            } finally {
                btn.innerText = "Enviar Teste";
                btn.disabled = false;
            }
        }

        // Função para Criar Instância e Pegar QR Code
        async function createNewInstance() {
            const instanceName = document.getElementById('newInstanceName').value;
            const btn = document.getElementById('btnCreateInstance');

            if (!instanceName) {
                alert("Digite um nome para a instância!");
                return;
            }

            btn.innerText = "Criando...";
            btn.disabled = true;

            try {
                const response = await fetch('/instance/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ instanceName })
                });

                const data = await response.json();
                
                if (data.success) {
                    // Tenta extrair o base64 do QR Code da resposta da Evolution API v2
                    // O caminho exato pode variar, geralmente é data.qrcode.base64
                    const base64Qr = data.data?.qrcode?.base64 || data.data?.base64;
                    
                    if (base64Qr) {
                        document.getElementById('qrCodeImg').src = base64Qr;
                        document.getElementById('qrCodeArea').classList.remove('hidden');
                    } else {
                        alert("Instância criada, mas o QR Code não foi retornado no formato esperado. Verifique o terminal.");
                    }
                    loadInstances();
                } else {
                    alert("Erro ao criar: " + JSON.stringify(data.error));
                }
            } catch (error) {
                alert("Erro no servidor: " + error);
            } finally {
                btn.innerText = "Criar e Gerar QR Code";
                btn.disabled = false;
            }
        }

        // Função para Listar Instâncias na Tabela
        async function loadInstances() {
            const tbody = document.getElementById('instancesTableBody');
            tbody.innerHTML = '<tr><td colspan="3" class="p-3 text-center">Carregando...</td></tr>';

            try {
                const response = await fetch('/instances');
                const data = await response.json();

                if (data.success && Array.isArray(data.data)) {
                    tbody.innerHTML = '';
                    if (data.data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="3" class="p-3 text-center">Nenhuma instância encontrada.</td></tr>';
                        return;
                    }

                    data.data.forEach(inst => {
                        // A estrutura da resposta da Evolution API
                        const nome = inst.name || inst.instanceName || 'Desconhecido';
                        const status = inst.connectionStatus || 'Desconectado';
                        const numero = inst.ownerJid ? inst.ownerJid.split('@')[0] : 'N/A';
                        
                        const statusColor = status.toLowerCase() === 'open' ? 'text-green-600 font-bold' : 'text-red-500';

                        tbody.innerHTML += `
                            <tr class="border-b border-slate-100">
                                <td class="p-3 font-medium">${nome}</td>
                                <td class="p-3"><span class="${statusColor}">${status}</span></td>
                                <td class="p-3">${numero}</td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="3" class="p-3 text-center text-red-500">Erro ao carregar lista.</td></tr>';
                }
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-3 text-center text-red-500">Erro de conexão: ${error}</td></tr>`;
            }
        }
    </script>
</body>
</html>
