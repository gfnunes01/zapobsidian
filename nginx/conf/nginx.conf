worker_processes 1;
events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # ============================================
    # SERVIDOR HTTP (SEM SSL POR ENQUANTO)
    # ============================================
    server {
        listen 8081;
        server_name painel.pdsolucoesdigital.online;

        # ===== ZAP OBSIDIAN =====
        location / {
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
        }

        # ===== EVOLUTION API =====
        location /evo/ {
            proxy_pass http://127.0.0.1:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ===== ARQUIVOS ESTÁTICOS =====
        location /static/ {
            alias "C:/Users/Administrator/Desktop/api evolution/evolution-backend/static/";
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ===== UPLOADS =====
        location /static/uploads/ {
            alias "C:/Users/Administrator/Desktop/api evolution/evolution-backend/static/uploads/";
            expires 30d;
        }
    }
}